# Publishes docs/ to docs-ebby.gthanasis.com (Cloudflare Pages project ebby-docs) whenever it changes on main.
#
# docs/ is the site as it is: index.html and the screenshots it shows, no build step. The Pages project, its
# domain and DNS record are made in gthanasis/infra, like every other hostname; this only uploads files.
#
# CLOUDFLARE_API_TOKEN may edit Cloudflare Pages and nothing else; CLOUDFLARE_ACCOUNT_ID is not a secret.
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://docs-ebby.gthanasis.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53e675d5eb3a19bcf5a767afe2ea3862
        run: npx --yes wrangler@4.14.0 pages deploy docs --project-name ebby-docs --branch main --commit-dirty=true
