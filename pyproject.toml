[project]
name = "bank-sync"
version = "0.1.0"
description = "Syncs Alpha Bank transactions through Enable Banking and shows where the money goes"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyjwt[crypto]>=2.8",
  "requests>=2.31",
  "anthropic>=1.15.0",
  "pywebpush>=2.5.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "python-multipart>=0.0.32",
]

[project.scripts]
bank-sync = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# Mistakes, not style: undefined or unused names, likely bugs, syntax, and sorted imports.
select = ["F", "E4", "E7", "E9", "B", "I"]
ignore = [
  "B008",  # FastAPI's File()/Form() parameters are meant to be called in the signature
  "B904",  # an HTTPException raised while handling another is the answer, not a second failure
  "B905",  # zip() over lists built side by side
  "E702", "E731", "E741",  # house style: short paired statements, small lambdas, l for a label
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
